  /api/acess-code/students/{student_id}/generate-code/:
    post:
      operationId: acess_code_students_generate_code_create
      description: Gera um novo código de acesso para um aluno. O código é válido
        durante 2 dias e revoga códigos anteriores.
      parameters:
      - in: path
        name: student_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Códigos de Acesso
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentAccessCode'
          description: ''
        '400':
          description: Não foi possível gerar o código.
        '404':
          description: Aluno não encontrado.
