      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCodeValidationResponse'
          description: ''
        '400':
          description: Código inválido, expirado ou já revogado.
        '429':
          description: Limite de tentativas excedido.
