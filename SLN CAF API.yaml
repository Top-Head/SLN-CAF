          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Refresh'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Sessão terminada com sucesso.
        '400':
          description: Refresh token inválido.
  /api/auth/password-reset:
    post:
      operationId: auth_password_reset_create
      description: Solicita a recuperação da password. A resposta não revela se o
        email está registado.
      tags:
      - Recuperação de Password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Se o email estiver registado, serão enviadas instruções de
            recuperação.
        '400':
          description: Email inválido.
