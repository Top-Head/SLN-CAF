components:
  schemas:
    AccessCodeValidationResponse:
      type: object
      properties:
        student:
          allOf:
          - $ref: '#/components/schemas/StudentAccessCodeStudent'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        grades:
          type: array
          items:
            $ref: '#/components/schemas/StudentGrade'
          readOnly: true
      required:
      - expires_at
      - grades
      - student
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - LOGIN
      - LOGIN_FAILED
      - LOGOUT
      - REFRESH
      - REGISTER
      - PASSWORD_RESET
      - VALIDATE
      - OTHER
      type: string
      description: |-
        * `CREATE` - Criação
        * `UPDATE` - Atualização
        * `DELETE` - Eliminação
        * `LOGIN` - Início de sessão
        * `LOGIN_FAILED` - Tentativa de início de sessão falhada
        * `LOGOUT` - Fim de sessão
        * `REFRESH` - Renovação de token
        * `REGISTER` - Registo
        * `PASSWORD_RESET` - Recuperação de password
        * `VALIDATE` - Validação
        * `OTHER` - Outra ação
    AnnualResult:
      type: object
      properties:
        enrollment:
          type: string
          format: uuid
        student:
          type: string
        turma:
          type: string
        school_class:
          type: integer
