  /api/auth/confirm-password/:
    post:
      operationId: auth_confirm_password_create
      description: Confirma a recuperação da password utilizando um token válido e
        define uma nova password.
      tags:
      - Recuperação de Password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Password alterada com sucesso.
        '400':
          description: Dados inválidos ou token expirado, inválido ou já utilizado.
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Autentica o utilizador e devolve um token de acesso e um token
        de renovação.
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Autenticação realizada com sucesso.
        '400':
          description: Dados de entrada inválidos.
        '401':
          description: Credenciais inválidas.
        '429':
          description: Limite de tentativas excedido.
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Termina a sessão revogando o refresh token fornecido.
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
          application/x-www-form-urlencoded:
            schema:
