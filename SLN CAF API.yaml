      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateStudentAccessCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ValidateStudentAccessCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ValidateStudentAccessCode'
        required: true
      security:
