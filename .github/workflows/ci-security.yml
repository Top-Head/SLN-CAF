
name: CI & Security

on:
  push:
    branches: [main, stage, feat/cicd-seguranca]
  pull_request:
    branches: [main, stage]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build --if-present

  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          set -euo pipefail

          curl --fail --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz

          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan Git history for secrets
        run: |
          gitleaks detect \
            --source . \
            --log-opts="--all" \
            --redact \
            --exit-code 1

  npm-audit:
    name: Dependency Audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      image: semgrep/semgrep

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/nextjs \
            --error \
            --sarif \
            --output semgrep.sarif

      - name: Validate SARIF report
        id: validate_sarif
        if: always() && hashFiles('semgrep.sarif') != ''
        run: |
          set -euo pipefail
          test -s semgrep.sarif
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("version") == "2.1.0" and isinstance(d.get("runs"), list)' semgrep.sarif

      - name: Fail if SARIF report is missing
        if: always() && hashFiles('semgrep.sarif') == ''
        run: |
          echo "::error::Semgrep did not generate semgrep.sarif."
          exit 1

      - name: Upload SARIF to GitHub Security
        if: always() && steps.validate_sarif.outcome == 'success'
        uses: github/codeql-action/upload-sarif@96f518a34f7a870018057716cc4d7a5c014bd61c # v3.29.10
        with:
          sarif_file: semgrep.sarif

      - name: Enforce Semgrep result
        if: always()
        env:
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
        run: |
          if [ "$SEMGREP_OUTCOME" != "success" ]; then
            echo "::error::Semgrep failed or detected findings."
            exit 1
          fi

  trivy-fs:
    name: Filesystem Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.76.1"
        run: |
          set -euo pipefail

          curl --fail --show-error --location \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output /tmp/trivy.tar.gz

          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Run Trivy filesystem scan
        id: trivy
        continue-on-error: true
        run: |
          set -euo pipefail

          trivy fs \
            --scanners vuln,misconfig,secret \
            --ignore-unfixed \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            .

      - name: Validate SARIF report
        id: validate_sarif
        if: always() && hashFiles('trivy-results.sarif') != ''
        run: |
          set -euo pipefail
          test -s trivy-results.sarif
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("version") == "2.1.0" and isinstance(d.get("runs"), list)' trivy-results.sarif

      - name: Fail if SARIF report is missing
        if: always() && hashFiles('trivy-results.sarif') == ''
        run: |
          echo "::error::Trivy did not generate trivy-results.sarif."
          exit 1

      - name: Upload SARIF to GitHub Security
        if: always() && steps.validate_sarif.outcome == 'success'
        uses: github/codeql-action/upload-sarif@96f518a34f7a870018057716cc4d7a5c014bd61c # v3.29.10
        with:
          sarif_file: trivy-results.sarif

      - name: Enforce Trivy result
        if: always()
        env:
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          if [ "$TRIVY_OUTCOME" != "success" ]; then
            echo "::error::Trivy failed or detected CRITICAL/HIGH findings."
            exit 1
          fi
